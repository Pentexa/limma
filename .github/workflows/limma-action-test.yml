name: Test Limma Action

on:
  push:
    paths:
      - '.github/actions/limma-scan/**'
      - 'backend/src/cli/**'
  workflow_dispatch:

jobs:
  test-action:
    name: Smoke Test (Local Action)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Local Action
        id: test
        uses: ./.github/actions/limma-scan
        with:
          target: https://httpbin.org
          timeout: '5'
          output-format: json
        continue-on-error: true  # httpbin may not have a running Limma backend

      - name: Verify Outputs
        if: steps.test.outcome == 'success'
        run: |
          echo "✅ Action ran successfully"
          echo "Scan ID: ${{ steps.test.outputs.scan-id }}"
          echo "Findings: ${{ steps.test.outputs.findings-count }}"
          echo "Score: ${{ steps.test.outputs.security-score }}"
