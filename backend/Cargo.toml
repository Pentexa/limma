[package]
name = "limma"
version = "0.1.0"
edition = "2021"
default-run = "limma"

[[bin]]
name = "limma"
path = "src/main.rs"

[[bin]]
name = "limma-cli"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["clap"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"], optional = true }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tower-http = { version = "0.5", features = ["cors", "timeout"] }
tower_governor = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "brotli", "gzip", "deflate"] }
scraper = "0.20"
url = "2.5"
regex = "1.10"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3.32"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
thiserror = "2"
anyhow = "1"
serde_yaml = "0.9"
glob = "0.3"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }
dotenvy = "0.15"
bcrypt = "0.15"
jsonwebtoken = "9"
urlencoding = "2"
